# ==============================================================================
#                      AquaChat Configuration
#        Universal RGB Gradient Chat & Item Engine for Paper 1.20.x – 1.21.11
#         Author: Turgut Efekan Koç (efekkoc) | GitHub: efekkoc/AquaChat
# ==============================================================================

settings:
  # Universal Paper 1.20.x – 1.21.11 compatibility mode
  engine_version: "1.21.11-Universal"
  enable_hex_colors: true
  enable_mention_ding: true
  mention_sound: "BLOCK_NOTE_BLOCK_BELL"

channels:
  global:
    prefix: "<gradient:#00d2ff:#3a7bd5>[Global]</gradient> "
    format: "%prefix%player%suffix% &8» &f%message%"
    radius: -1 # Infinite
  local:
    prefix: "<gradient:#11998e:#38ef7d>[Local]</gradient> "
    format: "%prefix%player%suffix% &8» &7%message%"
    radius: 100 # In blocks
  staff:
    prefix: "<gradient:#ff416c:#ff4b2b>[Staff]</gradient> "
    format: "%prefix%player% &8» &c%message%"
    permission: "aquachat.staffchat"

items:
  placeholder: "[i]"
  hover_display_name: true
  show_lore_and_enchants: true

# ==============================================================================
#                      Enterprise Anti-Spam Shield
# ==============================================================================
anti_spam:
  enabled: true
  # Message cooldown in seconds
  chat_cooldown_seconds: 2.0
  bypass_permission: "aquachat.bypass.spam"
  
  # Block duplicate messages
  block_duplicate_messages: true
  duplicate_message_warning: "<gradient:#ff416c:#ff4b2b>Spam Engellendi!</gradient> <gray>Lütfen aynı mesajı tekrar tekrar göndermeyiniz."

  # CAPS lock filter
  block_excessive_caps: true
  caps_percentage_threshold: 65
  caps_min_length: 6
  caps_warning: "<gradient:#ff416c:#ff4b2b>Büyük Harf Uyarısı!</gradient> <gray>Lütfen aşırı büyük harf kullanmayınız."

  # Command spam rate limiter
  command_rate_limit: true
  command_cooldown_seconds: 1.0
  command_warning: "<gradient:#ff416c:#ff4b2b>Yavaşlayın!</gradient> <gray>Çok hızlı komut giriyorsunuz."

  # Temporary Auto-Mute on repeated violations
  auto_mute_enabled: true
  auto_mute_violations: 4
  auto_mute_duration_seconds: 60
